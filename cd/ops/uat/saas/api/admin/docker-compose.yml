version: '3'
services:
  api-dxz-admin-uat:
    image: registry.cn-hangzhou.aliyuncs.com/wozth/api-dxz-admin-uat:$TAG
    restart: on-failure:3
    container_name: api-dxz-admin-uat
    environment:
      - TZ=$TZ
      - JVM_OPTS=-server -Xms4096m -Xmx4096m
      - JAVA_OPTS=-Djasypt.encryptor.password=02700083-9fd9-4b82-a4b4-9177e0560e92 -Dspring.config.location=/dows/saas/dxz-admin/configs/ -Dspring.profiles.active=uat
      #- APM=-javaagent:/dows/paas/apm/skywalking-agent/skywalking-agent.jar -Dskywalking.agent.service_name=dxz-admin-uat -Dskywalking.collector.backend_service=192.168.1.60:11800
    ports:
      - $EHP:8080
      - $EWP:80
    volumes:
      - ./logs:/dows/saas/dxz-admin/logs
      - ./configs:/dows/saas/dxz-admin/configs
      - ./resources:/data/resources/images/dxz
      #- /dows/paas/apm/skywalking-agent-8.16.0:/dows/paas/apm/skywalking-agent
    networks:
      - uat_net
#    networks:
#      uat_net:
#        ipv4_address: 172.18.0.6

networks:
  uat_net:
    external: true
