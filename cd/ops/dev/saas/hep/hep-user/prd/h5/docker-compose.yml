version: '3'
services:
  h5-dxz-user-prd:
    image: registry.cn-hangzhou.aliyuncs.com/wozth/h5-dxz-user-prd:$TAG
    restart: unless-stopped
    container_name: h5-dxz-user-prd
    environment:
      - TZ=$TZ
    ports:
      - 481:80
    volumes:
      - /dows/saas/dxz/h5-user/prd/logs:/dows/saas/dxz/h5-admin/logs
      - /dows/saas/dxz/h5-user/prd/configs:/dows/saas/dxz/h5-admin/configs
      - /dows/saas/dxz/h5-user/prd/resources:/dows/saas/dxz/h5-admin/resources
#      - /dows/saas/dxz/h5-admin/dev/nginx/nginx.conf:/etc/nginx/nginx.conf
      - /dows/saas/dxz/h5-user/prd/nginx/cert/:/etc/cert/
      #- /dows/saas/dxz/h5-admin/dev/nginx/www/:/usr/share/nginx/html/
      - /dows/saas/dxz/h5-user/prd/nginx/logs/:/usr/local/nginx/logs/
      - /dows/saas/dxz/h5-user/prd/nginx/conf:/usr/local/nginx/conf.d

networks:
  default:
    # 使用外部指定的网络，为 true 就标识网络必须存在
    external:
      # docker network create -d bridge 网络名称
      name: prd_net
