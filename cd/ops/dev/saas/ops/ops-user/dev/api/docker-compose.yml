version: '3'
services:
  dxz-user-dev:
    image: registry.cn-hangzhou.aliyuncs.com/dows/dxz-user:$TAG
    restart: unless-stopped
    container_name: dxz-user-$RTE
    environment:
      - RTE=$RTE
    ports:
      - $EHP:8080
      - $EWP:80
      #调式端口
#      - "5005:5005"
    volumes:
      - ./logs:/dows/dxz/dxz-user/logs
