version: '3'
services:
  pdf-generator:
    image: registry.cn-hangzhou.aliyuncs.com/wozth/pdf-generator:1.0.230825
    restart: unless-stopped
    container_name: pdf-generator
    environment:
      - TZ=$TZ
    ports:
      - 48080:8080
    networks:
      - uat_net
#    networks:
#      uat_net:
#        ipv4_address: 172.18.0.5

networks:
  uat_net:
    external: true