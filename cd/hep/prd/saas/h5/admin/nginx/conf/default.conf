map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

map $remote_addr $proxy_forwarded_elem {

    # IPv4 原样发送
    ~^[0-9.]+$        "for=$remote_addr";

    # IPv6 需要添加引号和括号
    ~^[0-9A-Fa-f:.]+$ "for=\"[$remote_addr]\"";

    default           "for=unknown";
}

map $http_forwarded $proxy_add_forwarded {

    # 如果传入的Forwarded有效，将其追加进标头
    "~^(,[ \\t]*)*([!#$%&'*+.^_`|~0-9A-Za-z-]+=([!#$%&'*+.^_`|~0-9A-Za-z-]+|\"([\\t \\x21\\x23-\\x5B\\x5D-\\x7E\\x80-\\xFF]|\\\\[\\t \\x21-\\x7E\\x80-\\xFF])*\"))?(;([!#$%&'*+.^_`|~0-9A-Za-z-]+=([!#$%&'*+.^_`|~0-9A-Za-z-]+|\"([\\t \\x21\\x23-\\x5B\\x5D-\\x7E\\x80-\\xFF]|\\\\[\\t \\x21-\\x7E\\x80-\\xFF])*\"))?)*([ \\t]*,([ \\t]*([!#$%&'*+.^_`|~0-9A-Za-z-]+=([!#$%&'*+.^_`|~0-9A-Za-z-]+|\"([\\t \\x21\\x23-\\x5B\\x5D-\\x7E\\x80-\\xFF]|\\\\[\\t \\x21-\\x7E\\x80-\\xFF])*\"))?(;([!#$%&'*+.^_`|~0-9A-Za-z-]+=([!#$%&'*+.^_`|~0-9A-Za-z-]+|\"([\\t \\x21\\x23-\\x5B\\x5D-\\x7E\\x80-\\xFF]|\\\\[\\t \\x21-\\x7E\\x80-\\xFF])*\"))?)*)?)*$" "$http_forwarded, $proxy_forwarded_elem";

    # 否则走替换
    default "$proxy_forwarded_elem";
}



server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;



    location ~ ^/api/(.*)$ {
        # 后端 api 的服务地址
        proxy_pass      http://api-hep-admin-prd:40001/$1$is_args$args;
        include         /usr/local/nginx/conf.d/proxy.conf;
        client_max_body_size 500m;
    } 
    location / {
        try_files $uri $uri/ /index.html;
    }
#     location /student {
#         proxy_pass      http://api-hep-admin-prd::8001/student;
#         include         proxy.conf;
#     }
    location ^~ /hepapi {
        # 后端静态资源的服务地址
        proxy_pass      http://api-hep-admin-prd:40001;
        include         /usr/local/nginx/conf.d/proxy.conf;
        client_max_body_size 500m;
    }
    # 这里的前缀应该是ws或其他与项目名不同的路径，否则如果项目需要加hep前缀，会无法区分前端资源和ws连接地址
    location ^~ /ws-hep {
        # 后端 ws 的服务地址
        proxy_pass      http://api-hep-admin-prd:4001/hep$is_args$args;
        include         /usr/local/nginx/conf.d/proxy.conf;
        client_max_body_size 3m;

    }
}
