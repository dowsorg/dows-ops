version: "3"
services:
  minio-sit:
    image: minio/minio:latest
    restart: always
    container_name: minio-sit
    command: server /data --console-address :9200
    ports:
      - "9002:9000"
      - "9200:9200"
    environment:
      TZ: Asia/Shanghai
      LANG: en_US.UTF-8
      MINIO_PROMETHEUS_AUTH_TYPE: "public"
      MINIO_ACCESS_KEY: "root"
      MINIO_SECRET_KEY: "password"
    logging:
      options:
        max-size: "10M"
        max-file: "10"
      driver: json-file
    volumes:
      - ./minio/data:/data
      - ./minio/config:/root/.minio
      - ./minio/minio:/minio
    networks:
      - sit_net
#    networks:
#      sit_net:
#        ipv4_address: 172.18.0.4

networks:
  sit_net:
    external: true