management:
    endpoints:
        web:
            exposure:
                include: '*'

server:
    port: 8080
    undertow:
        buffer-size: 1024
        direct-buffers: true
        threads:
            io: 4
            worker: 32
#    servlet:
#        context-path: /dxz


spring:
    application:
        name: dows-dxz
    profiles:
        include: dxz-mysql,dxz-mybatis,dxz-mvc,dxz-oss,dxz-apidoc,dxz-redisson,dxz-wozth,dxz-websocket
        active: prd

    jackson:
        default-property-inclusion: always
        date-format: yyyy-MM-dd HH:mm:ss
        time-zone: GMT+08:00
        serialization:
          write-dates-as-timestamps: false


