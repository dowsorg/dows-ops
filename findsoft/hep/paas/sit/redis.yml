version: "3"
services:

  redis-prd:
    image: redis
    container_name: redis-prd
    restart: always
    privileged: true
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./redis/data:/data
      - ./redis/conf/redis.conf:/etc/redis/redis.conf
      - ./redis/logs:/logs
    command: [ "redis-server","/etc/redis/redis.conf" ]
    ports:
      - 46379:6379

networks:
  default:
    external:
      name: prd_net