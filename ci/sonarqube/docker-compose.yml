version: '3'
services: 
  sonarqube:
    image: sonarqube:10.4.0-community
    restart: always 
    privileged: true
    container_name: sonarqube
    # depends_on:
    #   - postgres
    volumes:
      - sonarqube_extensions:/opt/sonarqube/extensions:rw
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_conf:/opt/sonarqube/conf:rw
      - /etc/localtime:/etc/localtime:ro
    ports:
      - 9000:9000
    environment:
      SONARQUBE_JDBC_USERNAME: postgres
      SONARQUBE_JDBC_PASSWORD: 123456
      SONARQUBE_JDBC_URL: jdbc:postgresql://postgres:5432/sonarqube
    command:
      # 内存设置
      - -Dsonar.ce.javaOpts=-Xmx2048m
      - -Dsonar.web.javaOpts=-Xmx2048m
      # 设置服务代理路径
      - -Dsonar.web.context=/
      # 此设置用于集成gitlab时，回调地址设置
      #- -Dsonar.core.serverBaseURL=https://sonarqube.example.com
    networks: 
      - cicd

#docker volume create --opt type=none --opt o=bind --opt device=/shdy/sonar my_volume
#docker run -v my_volume:/shdy/sonar -d your_image_name
volumes:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_conf:
  sonarqube_extensions:
    # driver: local
    # driver_opts:
    #   type: none
    #   o: bind
    #   device: /dows/paas/sonarqube/logs # 绑定的文件夹

networks:
  cicd:
    external: true

