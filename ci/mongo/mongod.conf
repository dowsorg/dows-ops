# 为配置文件指定一个合适的名称
# 注意：在 Linux 系统中，配置文件的权限需要限制，只能由 mongodb 用户读取和写入

# 存储数据的文件系统路径
storage:
  dbPath: /var/lib/mongo

# 使用 WiredTiger 存储引擎
storage:
  wiredTiger:
    engineConfig:
      configString: "allocation_size=1GB"

# 启用日志记录
systemLog:
  destination: file
  logAppend: true
  logRotate: reopen
  path: /var/log/mongodb/mongod.log
  quiet: false

# 设置端口号
net:
  port: 27017

# 启用 IPv6 支持
net:
  ipv6: true

# 绑定到特定的 IP 地址
net:
  bindIp: 127.0.0.1

# 设置进程的用户和组
processManagement:
  fork: true
  pidFilePath: /var/run/mongodb/mongod.pid

# 启用身份验证
security:
  authorization: enabled

# 创建一个用户管理员
security:
  clusterAuthMode: keyfile

# 设置一个键文件，用于 MongoDB 节点之间的认证
security:
  keyFile: /etc/mongo/keyfile

# 配置副本集
replication:
  replSetName: rs0

# 配置分片
sharding:
  clusterRole: shardsvr

# 配置审计级别
auditLog:
  destination: file
  path: /var/log/mongodb/audit.log
  format: JSON

# 开启对 MongoDB 性能数据的收集
metrics:
  metricRecordingLevel: slowOp