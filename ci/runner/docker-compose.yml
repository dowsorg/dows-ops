version: '3.3'
services:
  gitlab-runner:
    # build:
    container_name: gitlab-runner
    image: gitlab/gitlab-runner:v16.9.0
    privileged: true
    restart: always
    volumes:
      - gitlab_runner_settings:/etc/gitlab-runner
      - /var/run/docker.sock:/var/run/docker.sock
    networks: 
      - postgres_postgres
      
networks:
  postgres_postgres:
    external: true

volumes:
  gitlab_runner_settings:
