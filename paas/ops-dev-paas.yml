version: "3"
services:
  mysql-dev:
    # 指定镜像和版本
    image: mariadb
    # 指定容器的名称
    container_name: mysql-dev
    restart: always
    command:
      --max_connections=1000
      --character-set-server=utf8mb4
      --default-authentication-plugin=mysql_native_password
    environment:
      TZ: "Asia/Shanghai"
      MYSQL_ROOT_PASSWORD: "123456"
    # 容器日志大小配置
    logging:
      driver: 'json-file'
      options:
        max-size: '5g'
    volumes:
      # 挂载数据目录
      - ./prd/mysql/data:/var/lib/mysql:rw
      # 挂载配置文件目录
      - ./prd/mysql/conf.d:/etc/mysql/conf.d
      #- ./dows/hep/hep-mysql-dev/conf:/etc/mysql/conf.d:rw
    ports:
      - "43306:3306"
    networks:
      - dev_net

  minio-dev:
    image: minio/minio:latest
    container_name: minio-dev
    restart: always
    volumes:
      - "./prd/minio/data:/data"
      - "./prd/minio/minio:/minio"
      - "./prd/minio/config:/root/.minio"
    environment:
      TZ: Asia/Shanghai
      LANG: en_US.UTF-8
      MINIO_PROMETHEUS_AUTH_TYPE: "public"
      MINIO_ACCESS_KEY: "root"
      MINIO_SECRET_KEY: "password"
    command: server /data
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
    ports: # 映射端口
      - "49000:9000"
      - "42330:42330"
    networks:
      - dev_net

  redis-dev:
    image: redis
    container_name: redis-dev
    restart: always
    privileged: true
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./prd/redis/data:/data
      - ./prd/redis/conf/redis.conf:/etc/redis/redis.conf
      - ./prd/redis/logs:/logs
    command: [ "redis-server","/etc/redis/redis.conf" ]
    ports:
      - 46379:6379
    networks:
      - dev_net



networks:
  # 定义上面的服务用到的网络的名称，默认是驱动属于 bridge，自定义的网络名称，在实际中会变为 项目名(或所在文件目录名)
  dev_net:
    # 使用外部指定的网络，为 true 就标识网络必须存在
    external:
      # docker network create -d bridge 网络名称
      true